server_tokens off;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Pages statiques avec URL propres (priorité sur les blocs proxy)
    location = /        { try_files /index.html =404; }
    location = /edt     { try_files /edt.html =404; }
    location = /admin   { try_files /admin.html =404; }
    location = /notes   { try_files /notes.html =404; }
    location = /login   { try_files /login.html =404; }
    location = /setup-password { try_files /setup-password.html =404; }

    location / {
        try_files $uri $uri.html =404;
    }

    location /api/ {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/ {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /edt/ {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://app:5000;
    }
}
