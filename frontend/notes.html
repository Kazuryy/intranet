<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Web - Grille Uniforme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body class="m-0 font-sans text-slate-800">
    
    <div class="h-[10vh] flex flex-col shadow-md z-50 relative">
        <div class="h-[9vh] bg-white flex items-center justify-center">
            <h1 class="m-0 text-3xl text-indigo-900 font-bold">PRONOTE V2 TEST</h1>
        </div>
        <div class="h-[6vh] bg-indigo-900 flex items-center justify-between">
            <nav class="flex items-center" role="tablist" aria-label="Onglets principaux">
                <button role="tab" data-tab="accueil" data-href="index.html" aria-selected="true"
                    class="tab-btn px-3 py-3 text-sm font-bold text-white border-b-4 border-indigo-900 hover:transition hover:bg-white hover:text-indigo-900 hover:border-b-4 hover:border-red-500">
                    Accueil
                </button>
                <button role="tab" data-tab="edt" data-href="edt.html" aria-selected="false"
                    class="tab-btn px-3 py-3 text-sm font-bold text-white border-b-4 border-indigo-900 hover:transition hover:bg-white hover:text-indigo-900 hover:border-b-4 hover:border-red-500">
                    Emploi du temps
                </button>
                <div class="relative">
                    <button id="resultats-btn" role="tab" data-tab="resultats" data-href="resultats.html" aria-selected="false" aria-expanded="false"
                        class="tab-btn px-3 py-3 text-sm font-bold text-white border-b-4 border-indigo-900 hover:transition hover:bg-white hover:text-indigo-900 hover:border-b-4 hover:border-red-500">
                        Résultats
                    </button>
                    <div id="resultats-menu" class="hidden absolute top-full left-0 w-[200%] bg-white shadow-lg rounded-b-lg py-2 z-50">
                        <div class="px-0 py-2 border-b border-slate-200">
                            <button data-href="mes-notes.html" class="menu-link block w-full px-4 py-2 text-sm font-semibold text-indigo-900 border-l-4 border-transparent hover:border-red-500 hover:bg-indigo-50 transition-colors text-left">Mes notes</button>
                            <button data-href="releve.html" class="menu-link block w-full px-4 py-2 text-sm font-semibold text-indigo-900 border-l-4 border-transparent hover:border-red-500 hover:bg-indigo-50 transition-colors text-left">Relevé</button>
                        </div>
                        <div class="px-0 py-2">
                            <button data-href="bulletin.html" class="menu-link block w-full px-4 py-2 text-sm font-semibold text-indigo-900 border-l-4 border-transparent hover:border-red-500 hover:bg-indigo-50 transition-colors text-left">Mon Bulletin</button>
                        </div>
                    </div>
                </div>
                <button role="tab" data-tab="cahier-textes" data-href="travail.html" aria-selected="false"
                    class="tab-btn px-3 py-3 text-sm font-bold text-white border-b-4 border-indigo-900 hover:transition hover:bg-white hover:text-indigo-900 hover:border-b-4 hover:border-red-500">
                    Cahier de textes
                </button>
                <button role="tab" data-tab="cartne-correspondance" data-href="assiduity.html" aria-selected="false"
                    class="tab-btn px-3 py-3 text-sm font-bold text-white border-b-4 border-indigo-900 hover:transition hover:bg-white hover:text-indigo-900 hover:border-b-4 hover:border-red-500">
                    Carnet de correspondance
                </button>
                <button role="tab" data-tab="communication" data-href="communication.html" aria-selected="false"
                    class="tab-btn px-3 py-3 text-sm font-bold text-white border-b-4 border-indigo-900 hover:transition hover:bg-white hover:text-indigo-900 hover:border-b-4 hover:border-red-500">
                    Communication
                </button>
            </nav>
        </div>
    </div>

    <div class="relative z-10 flex flex-col h-[90vh] bg-gradient-to-br from-blue-100 via-indigo-50 to-purple-100 p-[1%] gap-2">
        
        <!-- ════════════════════════════════════════════════════════════════
             ║              SÉLECTEUR DE SEMAINES                          ║
             ════════════════════════════════════════════════════════════════ -->
        <div class="w-full bg-white shadow-md rounded-t-xl p-0">
            <div class="flex items-center justify-between px-4 pt-2 pb-1 gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="text-sm font-bold text-indigo-900">Détails de mes notes</h2>
                    <div id="week-info" class="text-sm font-bold text-slate-700 flex items-center gap-2">
                        <span id="week-dates">NOM Prénom - Classe</span>
                        <span id="week-type" class="px-3 py-1 rounded text-white text-xs">Semaine A</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2 px-4 pb-3">
                <select id="trimestre-select" class="px-4 py-0 text-sm font-semibold border-2 border-indigo-200 bg-white text-indigo-900 hover:border-indigo-400 cursor-pointer focus:outline-none focus:border-indigo-500">
                    <option value="1">Trimestre 1</option>
                    <option value="2">Trimestre 2</option>
                    <option value="3" selected>Trimestre 3</option>
                    <option value="annee">Année globale</option>
                </select>
            </div>
        </div>

        <!-- ════════════════════════════════════════════════════════════════
             ║              CONTENU PRINCIPAL                              ║
             ════════════════════════════════════════════════════════════════ -->
        <div class="w-full h-[85%] flex gap-2">
            <!-- Colonne gauche 1/3 - Liste des notes -->
            <div class="flex-1 bg-white/40 backdrop-blur-md border border-white/60 shadow-lg rounded-bl-2xl overflow-hidden flex flex-col">
                <div id="mes-notes-list" class="flex-1 overflow-y-auto px-2 py-3 flex flex-col gap-1">
                    <!-- Notes seront affichées ici -->
                </div>
            </div>

            <!-- Colonne droite 2/3 - Détails -->
            <div class="flex-[2] bg-white/40 backdrop-blur-md border border-white/60 shadow-lg rounded-br-2xl overflow-hidden flex flex-col">
                <div id="details-content" class="flex-1 overflow-y-auto p-4">
                    <!-- Détails seront affichés ici -->
                </div>
            </div>
        </div>
    </div>

    <style>
        /* Remplace #notes-list par #mes-notes-list */
        #mes-notes-list {
            display: flex !important;
            flex-direction: column !important;
            gap: 0.25rem !important;
        }

        /* Note item styling */
        .note-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.5rem;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            border-left: 3px solid transparent;
            width: 100%;
            box-sizing: border-box;
        }

        .note-item:hover {
            background: rgba(255, 255, 255, 0.8);
            border-left-color: #e6aeae;
        }

        .note-item.active {
            background: rgba(255, 255, 255, 0.9);
            border-left-color: #ef4444;
        }

        .note-date-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 0;
            font-size: 0.6rem;
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            flex-shrink: 0;
        }

        .note-item-info {
            flex: 1;
            min-width: 0;
        }

        .note-item-matiere {
            font-size: 0.8rem;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            line-height: 1.2;
        }

        .note-item-moyenne {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 0;
            line-height: 1.2;
        }

        .note-item-value {
            font-size: 1rem;
            font-weight: 700;
            color: #6366f1;
            min-width: 40px;
            text-align: right;
            flex-shrink: 0;
        }

        /* ... un peu plus bas pour la scrollbar ... */
        #mes-notes-list::-webkit-scrollbar {
            width: 6px;
        }

        #mes-notes-list::-webkit-scrollbar-track {
            background: transparent;
        }

        #mes-notes-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        #mes-notes-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Details styling */
        .details-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .details-header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .details-matiere {
            font-size: 1.125rem;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .details-date {
            font-size: 0.875rem;
            color: #64748b;
        }

        .details-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 0.375rem;
        }

        .details-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #475569;
        }

        .details-label.highlight {
            color: #6366f1;
        }

        .details-value {
            font-size: 0.875rem;
            font-weight: 700;
            color: #1e293b;
        }

        .details-value.highlight {
            color: #6366f1;
            font-size: 1rem;
        }
    </style>

    <script>
        let notesData = [];
        let couleursData = {};
        let selectedNoteId = null;

        // ════════════════════════════════════════════════════════════════
        // Récupérer les notes depuis l'API
        // ════════════════════════════════════════════════════════════════
        async function fetchNotes() {
            try {
                const response = await fetch('/api/notes');
                if (!response.ok) throw new Error('Erreur lors du chargement des notes');
                
                const notes = await response.json();
                
                // Transformer les données pour le format de l'interface
                notesData = notes.map(note => {
                    const date = new Date(note.date_evaluation);
                    const jour = date.getDate();
                    const mois = ['jan.', 'fév.', 'mars', 'avr.', 'mai', 'juin', 
                                 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'][date.getMonth()];
                    const annee = date.getFullYear();
                    
                    return {
                        ...note,
                        jour: jour,
                        mois: mois,
                        annee: annee,
                        couleur: couleursData[note.matiere] || '#6366f1',
                        moyenne: note.moyenne_classe.toString().replace('.', ','),
                        plusHaute: note.note_plus_haute,
                        plusBasse: note.note_plus_basse
                    };
                });
                
                renderNotes();
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('mes-notes-list').innerHTML = 
                    '<div style="padding: 1rem; color: red;">Erreur lors du chargement des notes</div>';
            }
        }

        // ════════════════════════════════════════════════════════════════
        // Récupérer les couleurs des matières
        // ════════════════════════════════════════════════════════════════
        async function fetchCouleurs() {
            try {
                const response = await fetch('/api/couleurs-matieres');
                if (!response.ok) throw new Error('Erreur lors du chargement des couleurs');
                couleursData = await response.json();
                fetchNotes();
            } catch (error) {
                console.error('Erreur:', error);
                fetchNotes(); // Continuer même sans couleurs
            }
        }

        // ════════════════════════════════════════════════════════════════
        // Afficher les notes dans la liste
        // ════════════════════════════════════════════════════════════════
        function renderNotes() {
            const container = document.getElementById('mes-notes-list'); 
            container.innerHTML = notesData.map(note => `
                <div class="note-item ${selectedNoteId === note.id ? 'active' : ''}" onclick="selectNote(${note.id})">
                    <div class="note-date-badge" style="background-color: ${note.couleur};">
                        <div>${note.jour}</div>
                        <div>${note.mois}</div>
                    </div>
                    <div class="note-item-info">
                        <div class="note-item-matiere">${note.matiere}</div>
                        <div class="note-item-moyenne">Moyenne de la classe : ${note.moyenne}</div>
                    </div>
                    <div class="note-item-value">${note.note.toFixed(2)}</div>
                </div>
            `).join('');
        }

        // ════════════════════════════════════════════════════════════════
        // Afficher les détails d'une note
        // ════════════════════════════════════════════════════════════════
        function selectNote(id) {
            selectedNoteId = id;
            renderNotes();
            
            const note = notesData.find(n => n.id === id);
            const detailsContainer = document.getElementById('details-content');
            
            if (note) {
                detailsContainer.innerHTML = `
                    <div class="details-container">
                        <div class="details-header">
                            <div class="details-matiere">${note.matiere}</div>
                            <div class="details-date">Note du ${note.jour} ${note.mois} ${note.annee}</div>
                        </div>
                        
                        <div class="details-row">
                            <span class="details-label highlight">Note élève :</span>
                            <span class="details-value highlight">${note.note.toFixed(2)}</span>
                        </div>
                        
                        <div class="details-row">
                            <span class="details-label">Moyenne classe :</span>
                            <span class="details-value">${note.moyenne}</span>
                        </div>
                        
                        <div class="details-row">
                            <span class="details-label">Note la plus haute :</span>
                            <span class="details-value">${note.plusHaute}</span>
                        </div>
                        
                        <div class="details-row">
                            <span class="details-label">Note la plus basse :</span>
                            <span class="details-value">${note.plusBasse}</span>
                        </div>
                        
                        <div class="details-row">
                            <span class="details-label">Coefficient :</span>
                            <span class="details-value">${note.coefficient}</span>
                        </div>
                    </div>
                `;
            }
        }

        // ════════════════════════════════════════════════════════════════
        // Initialisation
        // ════════════════════════════════════════════════════════════════
        document.addEventListener('DOMContentLoaded', () => {
            fetchCouleurs();
        });

        // Écouter le changement de trimestre
        document.getElementById('trimestre-select')?.addEventListener('change', async (e) => {
            const trimestre = e.target.value;
            if (trimestre === 'annee') {
                fetchNotes();
            } else {
                try {
                    const response = await fetch(`/api/notes/trimestre/${trimestre}`);
                    if (!response.ok) throw new Error('Erreur');
                    const notes = await response.json();
                    notesData = notes.map(note => {
                        const date = new Date(note.date_evaluation);
                        const jour = date.getDate();
                        const mois = ['jan.', 'fév.', 'mars', 'avr.', 'mai', 'juin', 
                                     'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'][date.getMonth()];
                        const annee = date.getFullYear();
                        return {
                            ...note,
                            jour: jour,
                            mois: mois,
                            annee: annee,
                            couleur: couleursData[note.matiere] || '#6366f1',
                            moyenne: note.moyenne_classe.toString().replace('.', ','),
                            plusHaute: note.note_plus_haute,
                            plusBasse: note.note_plus_basse
                        };
                    });
                    renderNotes();
                } catch (error) {
                    console.error('Erreur:', error);
                }
            }
        });
    </script>
</body>
</html>
