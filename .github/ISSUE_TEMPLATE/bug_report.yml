name: 🐛 Bug Report
description: Signaler un bug ou un comportement inattendu
labels: ['bug', 'awaiting triage']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Décris le bug de manière claire et concise.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Comment reproduire le bug ?
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Observer l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Que devrait-il se passer normalement ?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexte additionnel
      description: Logs, captures d'écran, ou toute autre information utile.

  - type: checkboxes
    id: existing
    attributes:
      label: Vérification
      options:
        - label: J'ai vérifié que cette issue n'existe pas déjà.
          required: true
