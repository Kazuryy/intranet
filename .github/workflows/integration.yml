name: Integration Tests (MySQL)

on:
  workflow_dispatch:

jobs:
  integration:
    name: Tests contre MySQL réel
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8
        env:
          MYSQL_DATABASE: guardia_db
          MYSQL_USER: guardia
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-integration-secret-not-for-prod
      DATABASE_URL: mysql+pymysql://guardia:testpassword@127.0.0.1:3306/guardia_db

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests against MySQL
        run: pytest tests/ -v --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: coverage-mysql
          path: coverage.xml
