name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'

  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  lint:
    name: Lint Flask Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install flake8
        run: pip install flake8

      - name: Launch flake8
        run: flake8 app/ tests/

  test:
    name: Flask tests
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-prod
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest tests/ --cov=app --cov-report=term --cov-report=xml
  
  pip-audit:
    name: Pip Audit Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: upgrade pip
        run: pip install --upgrade pip

      - name: install pip-audit
        run: pip install pip-audit

      - name: run pip-audit
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json

      - name: upload pip-audit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  build:
    name: build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, pip-audit]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: link Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

      - name: build docker image
        run: docker build -t guardia:${{ github.sha }} .

  zap:
    name: OWASP ZAP scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Launch app
        run: docker compose -f docker-compose.yml up -d

      - name: wait for healthy status
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && break
            echo "Waiting... ($i/30)"
            sleep 2
          done
        
      - name: run scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:5000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'

      - name: upload ZAP scan report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: zap-scan-report
          path: report_html.html

      - name: stop app
        if: always()  
        run: docker compose -f docker-compose.yml down
