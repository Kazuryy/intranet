name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main
      - develop

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check if code files changed
        id: check
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before }}
          if git diff --name-only "$BASE" HEAD | grep -qE '^(app/|tests/|requirements\.txt|Dockerfile)'; then
            echo "code=true" >> $GITHUB_OUTPUT
          else
            echo "code=false" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint Flask Code
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install flake8
        run: pip install flake8

      - name: Launch flake8
        run: flake8 app/ tests/

  test:
    name: Flask tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-test-secret-not-for-prod
      DATABASE_URL: "sqlite:///:memory:"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest tests/ --cov=app --cov-report=term --cov-report=xml

      - name: upload coverage report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-report
          path: coverage.xml

  pip-audit:
    name: Pip Audit Scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: upgrade pip
        run: pip install --upgrade pip

      - name: install pip-audit
        run: pip install pip-audit

      - name: run pip-audit
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json

      - name: upload pip-audit report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  build:
    name: build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, pip-audit]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: link Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile

      - name: build docker image
        run: docker build -t guardia:${{ github.sha }} .

  zap:
    name: OWASP ZAP scan
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop'))

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: run scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://temp2.guardiaroot.fr'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-I'

      - name: upload ZAP scan report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        if: always()
        with:
          name: zap-scan-report
          path: report_html.html

  sonar:
    name: SonarCloud Scan
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: Run SonarCloud
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-status:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test, pip-audit, build]
    if: always()
    steps:
      - name: Verifier que tous les jobs ont reussi ou ete skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
